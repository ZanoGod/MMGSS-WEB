<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="description" content="Contact Myanmar GSS Co., Ltd. in Kyaukkone, Yangon.">
        <title>Myanmar GSS | Contact</title>

        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="../css/contact.css">
        <link rel="stylesheet" href="../css/footer.css">


        <link rel="icon" href="../assets/favicon.ico" sizes="any">
        <link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon-192.png">
        <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>
    <body id="top" class="about-page">
        <div class="page-loader" id="pageLoader" aria-hidden="true">
            <div class="loader-inner">
                <div class="loader-logo"><img src="../assets/logo.png" alt=""></div>
                <div class="loader-line"><span></span></div>
            </div>
        </div>
        <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>
        <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

        <header class="nav-shell">
            <div class="container nav-inner">
                <a class="brand" href="/" aria-label="Myanmar GSS home" data-i18n-aria-label="common.brandHome">
                    <span class="brand-logo-wrap"><img class="brand-logo" src="../assets/logo.png" alt="Myanmar GSS logo"
                        data-i18n-alt="header.brandName"></span>
                    <span class="brand-copy"><span class="brand-name" data-i18n="header.brandName">Myanmar GSS</span><span
                        class="brand-note" data-i18n="header.brandNoteGlobal">Overseas Employment Agency</span></span>
                </a>
                <button class="nav-toggle" id="navToggle" type="button" aria-label="Open navigation" aria-expanded="false"
                    data-i18n-aria-label="common.openNavigation">
                <span></span><span></span><span></span>
                </button>
        </header>
        <section class="page-hero">
            <div class="container">
                <h1 data-i18n="workCondition.hero.title">Worker's work conditions</h1>
            </div>
        </section>
    </body>

     <button class="backtop" id="backTop" type="button" aria-label="Back to top"
            data-i18n-aria-label="common.backToTop">↑</button>
        <script src="../js/components.js"></script>
        <script src="../js/vendor/i18next.min.js"></script>
        <script src="../js/i18n.js"></script>
        <script src="../js/script.js"></script>

</html>
